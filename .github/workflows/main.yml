name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install web deps
        run: pnpm install

      - name: Build web app
        run: pnpm run build

      - name: Install Capacitor
        run: pnpm add @capacitor/core @capacitor/cli @capacitor/ios

      - name: Init Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.azawy.macosweb",
            "appName": "MacOSWeb",
            "webDir": "dist"
          }
          EOF

      - name: Add iOS platform
        run: pnpm exec cap add ios

      - name: Copy web assets
        run: pnpm exec cap copy ios

      - name: Set iOS deployment target
        run: |
          sed -i '' "s/platform :ios.*/platform :ios, '14.0'/" ios/App/Podfile

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install

      - name: Archive (unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            archive

      - name: Package IPA
        run: |
          cd ios/App/build
          mkdir Payload
          cp -r App.xcarchive/Products/Applications/*.app Payload/
          zip -r MacOSWeb-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MacOSWeb-ipa
          path: ios/App/build/MacOSWeb-unsigned.ipa
